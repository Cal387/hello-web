<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About Cal</title>
  <style>
    :root {
      --bg: #fafaf9;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --accent: #60a5fa;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 32rem;
      padding: 2rem 1rem;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 0.5rem;
    }
    .tagline {
      color: var(--accent);
      font-weight: 600;
      margin: 0 0 1.5rem;
    }
    p {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm Cal</h1>
    <p class="tagline">Business student · Learning AI coding</p>
    <p>I study business and I'm teaching myself to build things with code, using AI as my pair programmer. This page is one of my first projects.</p>
  </main>
</body>
</html>
